# A Cloudflare Worker: the built game from dist as static assets, and the API in worker/. The
# Worker sees every request (run_worker_first), so plain http and www redirect to the one URL
# in code; /api/* answers from worker/, everything else from the assets. Workers Builds deploys
# it from GitHub on each push to main.
name = "wheels-off"
main = "worker/index.ts"
compatibility_date = "2026-10-06"

# The public address. www gets its own custom domain so it resolves; a Redirect Rule on the zone
# sends it to the bare domain. workers.dev is off, so the game has one URL. Domains changed in
# the dashboard are overwritten on the next deploy, so they live here.
routes = [
  { pattern = "playwheelsoff.com", custom_domain = true },
  { pattern = "www.playwheelsoff.com", custom_domain = true },
]
workers_dev = false

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = true

# The leaderboards (README, Deploy).
[[d1_databases]]
binding = "DB"
database_name = "wheels-off"
database_id = "46c1a91b-df0a-4f10-9da5-71d77e3e5ed8"

# Once a day, 03:17 UTC: play counts older than 13 months are deleted (worker/play.ts), as the
# privacy page says.
[triggers]
crons = ["17 3 * * *"]
