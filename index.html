<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#7ccac0" />
    <meta name="description" content="A free 3D skateboarding game in your browser. Skate an endless sakura town at golden hour, ollie the obstacles for the weekly hi-scores, race the time trial, or free roam to lo-fi music." />
    <!-- one address for search engines, whatever ?ref a link carries -->
    <link rel="canonical" href="https://playwheelsoff.com/" />
    <!-- the link preview where the game is shared (X, WhatsApp, Discord): a large image card of
         public/preview.jpg, a 1200×630 shot of the landing page with the menus hidden (README) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://playwheelsoff.com/" />
    <meta property="og:title" content="Wheels Off" />
    <meta property="og:description" content="Skate an endless sakura town at golden hour, in your browser. Ollie the obstacles for the hi-scores, or free roam to lo-fi music." />
    <meta property="og:image" content="https://playwheelsoff.com/preview.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Wheels Off: an anime kid in a beanie and headphones skating down a street of shops and a cherry tree at sunset" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Press+Start+2P&display=swap" rel="stylesheet" />
    <!-- the big downloads start with the page, not after the bundle asks for them -->
    <link rel="preload" href="/art/manifest.json" as="fetch" crossorigin />
    <link rel="preload" href="/art/character.vrm" as="fetch" crossorigin />
    <title>Wheels Off: a free 3D skateboarding game in your browser</title>
    <!-- the splash below paints before the bundle arrives; Boot.tsx redraws it with a live bar,
         so these rules mirror the .boot block in styles.css -->
    <style>
      body {
        margin: 0;
        background: #7ccac0;
        overflow: hidden;
      }
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 0 16px;
        color: #23312e;
        font-family: 'Dela Gothic One', 'Hiragino Sans', 'Noto Sans JP', system-ui, sans-serif;
        text-align: center;
      }
      .boot__title {
        margin: 0;
        font-size: clamp(34px, 7vw, 64px);
        letter-spacing: 0.04em;
        line-height: 1;
      }
      .boot__jp {
        margin: 0 0 18px;
        font-size: 15px;
        opacity: 0.7;
      }
      .boot__bar {
        width: min(340px, 80vw);
        height: 18px;
        background: #fdfaf2;
        border: 3px solid #23312e;
        border-radius: 12px;
        box-shadow: 3px 4px 0 #23312e;
        overflow: hidden;
      }
      .boot__fill {
        height: 100%;
        width: 0;
        background: #f2c14e;
        transition: width 0.25s ease-out;
      }
      .boot__fill--wait {
        width: 30%;
        animation: boot-sweep 1.1s ease-in-out infinite alternate;
      }
      @keyframes boot-sweep {
        from {
          margin-left: 0;
        }
        to {
          margin-left: 70%;
        }
      }
      .boot__note {
        margin: 0;
        font-size: 12px;
        font-family: 'Press Start 2P', ui-monospace, monospace;
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot" aria-label="Wheels Off is loading">
        <h1 class="boot__title">WHEELS OFF</h1>
        <p class="boot__jp">ホイールズ・オフ</p>
        <div class="boot__bar"><div class="boot__fill boot__fill--wait"></div></div>
        <p class="boot__note">loading the town…</p>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
